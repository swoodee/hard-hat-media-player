# Builds the app on every push and pull request, so contributors see straight away if something breaks.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Build
        run: dotnet build src/HardHatMediaPlayer --configuration Release -warnaserror
