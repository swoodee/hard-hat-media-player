# Pushing a version tag (git tag v1.2.3 && git push origin v1.2.3) builds the installer and the portable zip
# and publishes them as a GitHub release for that tag.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer and portable zip
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          (Get-Content .github/release-notes.md -Raw).Replace('{VERSION}', $version) | Set-Content notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME artifacts/*.exe artifacts/*.zip `
            --title "Hard Hat Media Player $version" --notes-file notes.md
